name: Mworago
options:
  bundleIdPrefix: com.g1g1e
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  MworagoCore:
    path: .

targets:
  Mworago:
    type: application
    platform: iOS
    sources:
      - path: MworagoApp
        excludes: ["Resources"]
      - path: MworagoApp/Resources
        buildPhase: resources
      - path: MworagoApp/Assets.xcassets
      # 개인정보 보고서. 모으는 것이 없다는 선언이라 내용은 비어 있지만,
      # 파일 자체가 없으면 심사에서 매번 같은 것을 묻는다.
      - path: MworagoApp/PrivacyInfo.xcprivacy
    dependencies:
      - package: MworagoCore
        product: MworagoCore
    info:
      path: MworagoApp/Info.plist
      properties:
        CFBundleDisplayName: 뭐라고
        # 런치 화면과 스플래시가 같은 바닥색을 쓴다. 다르면 앱이 열리는 순간
        # 흰 판이 한 번 깜빡이고, 그 깜빡임이 애니메이션의 첫 프레임을 먹는다.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # 사전을 통째로 싣고 네트워크를 쓰지 않는다. 암호화를 직접 쓰는 곳이 없으므로
        # 수출 규정 신고 대상이 아니다. 적어 두지 않으면 심사에 낼 때마다 묻는다.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - ZenMaruGothic-Regular.ttf
          - ZenMaruGothic-Medium.ttf
          - GowunDodum-Regular.ttf
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"      # iPhone·iPad 유니버설
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        # 시뮬레이터와 CI 는 서명 없이 짓는다.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        # **실기기는 서명해야 올라간다.** 팀을 여기 적어 두지 않으면
        # `xcodegen generate` 를 돌릴 때마다 Xcode 에서 고른 팀이 지워지고,
        # 그러면 다음 실행에서 서명이 안 돼 기기에 못 올린다.
        # 무료 개인 팀이라 프로비저닝 프로파일은 7일마다 새로 받아야 한다 —
        # 아이폰을 꽂고 Xcode 에서 한 번 실행하면 자동으로 갱신된다.
        DEVELOPMENT_TEAM: C5P7V9S6NT
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        CODE_SIGNING_REQUIRED[sdk=iphoneos*]: YES
