name: Mworago
options:
  bundleIdPrefix: com.g1g1e
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  MworagoCore:
    path: .

targets:
  Mworago:
    type: application
    platform: iOS
    sources:
      - path: MworagoApp
        excludes: ["Resources"]
      - path: MworagoApp/Resources
        buildPhase: resources
      - path: MworagoApp/Assets.xcassets
      # 개인정보 보고서. 모으는 것이 없다는 선언이라 내용은 비어 있지만,
      # 파일 자체가 없으면 심사에서 매번 같은 것을 묻는다.
      - path: MworagoApp/PrivacyInfo.xcprivacy
    dependencies:
      - package: MworagoCore
        product: MworagoCore
    info:
      path: MworagoApp/Info.plist
      properties:
        CFBundleDisplayName: 뭐라고
        UILaunchScreen: {}
        # 사전을 통째로 싣고 네트워크를 쓰지 않는다. 암호화를 직접 쓰는 곳이 없으므로
        # 수출 규정 신고 대상이 아니다. 적어 두지 않으면 심사에 낼 때마다 묻는다.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - ZenMaruGothic-Regular.ttf
          - ZenMaruGothic-Medium.ttf
          - GowunDodum-Regular.ttf
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"      # iPhone·iPad 유니버설
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
